name: Authenticate GitHub Owner
description: Generate an owner-scoped GitHub App installation token and authenticate gh.

inputs:
  owner:
    description: GitHub owner or organization name.
    required: true
  json-variables:
    description: Serialized GitHub variables object.
    required: false
    default: '{}'
  json-secrets:
    description: Serialized GitHub secrets object.
    required: true
  app-credential-scope:
    description: Credential scope used to resolve GitHub App secrets (default, release, etc.).
    required: false
    default: default
  app-credential-prefix:
    description: Prefix used to resolve GitHub App variable and secret names.
    required: false
    default: GIT_GITHUB_APP

outputs:
  token:
    description: Generated owner-scoped GitHub App installation token.
    value: ${{ steps.generate-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token for owner
      id: generate-token
      shell: bash
      run: |
        owner='${{ inputs.owner }}'
        all_variables='${{ inputs.json-variables }}'
        all_secrets='${{ inputs.json-secrets }}'
        credential_scope='${{ inputs.app-credential-scope }}'
        credential_prefix='${{ inputs.app-credential-prefix }}'

        if [ -z "${owner}" ]; then
          echo "Input 'owner' is required"
          exit 1
        fi

        source "${GITHUB_ACTION_PATH}/../../scripts/github_app_token.sh"
        token=$(github_app_token_for_owner_from_payloads "${owner}" "${all_variables}" "${all_secrets}" "${credential_scope}" "${credential_prefix}")

        if [ -z "${token}" ]; then
          echo "Failed to generate GitHub App token for owner ${owner}"
          exit 1
        fi

        echo "::add-mask::${token}"
        echo "token=${token}" >> "$GITHUB_OUTPUT"

    - name: Authenticate gh for owner
      shell: bash
      run: |
        token='${{ steps.generate-token.outputs.token }}'
        if [ -z "${token}" ]; then
          echo "Missing generated token"
          exit 1
        fi
        token_file=$(mktemp)
        trap 'rm -f "${token_file}"' EXIT
        printf '%s\n' "${token}" > "${token_file}"
        gh auth login --with-token < "${token_file}"
        echo "GH_TOKEN=${token}" >> "$GITHUB_ENV"
        echo "GITHUB_TOKEN=${token}" >> "$GITHUB_ENV"
