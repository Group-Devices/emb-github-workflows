name: 'Conan library test, build, publish'

on:
  workflow_call:
    inputs:
      run-as-fast-build:
        description: 'Run as fast build, need conan context and profile as parameter'
        required: false
        type: boolean
        default: false
      enable-quality-analysis:
        description: 'Enable or not the SonarQube analysis'
        required: false
        type: boolean
        default: false
      enable-rebuild-collectors:
        description: 'Enable or not the rebuild of collectors'
        required: false
        type: boolean
        default: true
      rebuild-target:
        description: "Optional rebuild entry point"
        required: false
        type: string
        default: ""
      enable-rebuild-context:
        description: 'Enable or not the rebuild of context'
        required: false
        type: boolean
        default: false
      build-missing:
        description: 'Build missing packages'
        required: false
        type: boolean
        default: false
      force-build:  
        description: 'Legacy source build context payload'
        required: false
        type: string
        default: ''
      source-build-context:
        description: 'Source build context payload'
        required: false
        type: string
        default: ''
      conan-context:
        description: 'Conan context plain text when run-as-fast-build is true'
        required: false
        type: string
        default: ''
      conan-profiles:
        description: 'Conan profile as json string'
        required: false
        type: string
        default: ''
      run-unit-tests:
        description: 'Run unit tests'
        required: false
        type: boolean
        default: false
      enabled-doxygen:
        description: 'Enable package Doxygen generation'
        required: false
        type: boolean
        default: false
      extra-pip-packages:
        description: 'Space-separated extra pip packages to install before Conan lock/create (semversioner is always installed)'
        required: false
        type: string
        default: ''
      runner-type:
        description: 'Runner of the build job: empty for the default EKS runner, or ec2-x64-spot, ec2-x64-ondemand, ec2-x64-ondemand-large, ec2-arm64-ondemand, ec2-arm64-ondemand-large'
        required: false
        type: string
        default: ''


env:
  ALL_SECRETS: ${{ toJson(secrets) }}
  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
  CONAN_CONTEXT_PATH: ".conan-context/conan-context.yml"
  BUILD_ID: "${{github.run_number}}"
  RUN_ID: ${{ github.run_id }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  REPO: ${{ github.repository }}
  PACKAGE_NAME: ${{ github.event.repository.name }}

jobs:
  generate-conan-context:
    runs-on: eks-runner-linux-x64-medium
    if: inputs.run-as-fast-build == false
    container:
      image: repository.nexus.vixtechnology.com/docker-internal-group/aurora-compiler:main
      credentials:
        username: ${{ secrets.REPOSITORY_USERNAME_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
        password: ${{ secrets.REPOSITORY_TOKEN_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
    outputs:
      build-profile-list: ${{ steps.generate-conan-context.outputs.build-profile-list }}
      collectors-list: ${{ steps.generate-conan-context.outputs.collectors-list }}
      collector-topology: ${{ steps.generate-conan-context.outputs.collector-topology }}
      docker-config: ${{ steps.generate-conan-context.outputs.docker-config }}

    steps:
      - uses: actions/checkout@v6
      - uses: $/.github/actions/generate-conan-context
        id: generate-conan-context
        with:
          json-secrets: ${{ toJson(secrets) }}
  unit-tests:
    runs-on: eks-runner-linux-x64-medium
    if: inputs.run-as-fast-build == false && inputs.run-unit-tests
    outputs:
      status: ${{ job.status }}
    container:
      image: repository.nexus.vixtechnology.com/docker-internal-group/aurora-compiler:main
      credentials:
        username: ${{ secrets.REPOSITORY_USERNAME_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
        password: ${{ secrets.REPOSITORY_TOKEN_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
    needs:
      - generate-conan-context
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: conan-context
          path: .conan-context
      - name: Configure Conan
        uses: $/.github/actions/configure-conan
        with:
          json-secrets: ${{ toJson(secrets) }}
          conan-context-path: ${{ env.CONAN_CONTEXT_PATH }}

      - run: bash test.sh
      - name: run logs if fail
        if: failure()
        run: |
          cat coverage/Testing/Temporary/LastTest*

      # The non-Docker Linux publisher explicitly resolves `python3` from
      # PATH and creates its own virtual environment from it.  Use a complete,
      # current interpreter rather than the compiler image's system Python.
      - name: Setup Python for test-result publishing
        if: ${{ !cancelled() && hashFiles('coverage/junit-results.xml') != '' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Verify Python virtual-environment support
        if: ${{ !cancelled() && hashFiles('coverage/junit-results.xml') != '' }}
        run: python3 -c 'import sys, venv; print(sys.executable)'
          
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: ${{ !cancelled() && hashFiles('coverage/junit-results.xml') != '' }}
        with:
          files: coverage/junit-results.xml

      - name: Report code coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage.info') != '' }}
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: coverage/coverage.info
          minimum-coverage: 0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: code-coverage-report
          update-comment: true
          
  quality-analysis:
    runs-on: eks-runner-linux-x64-medium
    container:
      image: ghcr.io/actions/actions-runner:latest
    needs:
      - generate-conan-context
    if: inputs.run-as-fast-build == false && inputs.enable-quality-analysis
    steps:
      - run: echo "Will run a SonarQube analysis"
  collector-relevance:
    runs-on: eks-runner-linux-x64-medium
    if: always()
    needs:
      - generate-conan-context
    outputs:
      should-build: ${{ steps.resolve.outputs.should-build }}
      relevant-profiles: ${{ steps.resolve.outputs.relevant-profiles }}
    container:
      image: repository.nexus.vixtechnology.com/docker-internal-group/aurora-compiler:main
      credentials:
        username: ${{ secrets.REPOSITORY_USERNAME_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
        password: ${{ secrets.REPOSITORY_TOKEN_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Conan context
        shell: bash
        run: |
          if [ -n "${{ inputs.conan-context }}" ]; then
            mkdir -p .conan-context
            printf '%s\n' "${{ inputs.conan-context }}" > .conan-context/conan-context.yml
          else
            mkdir -p .conan-context
          fi

      - name: Download Conan context artifact
        if: inputs.conan-context == '' && inputs.run-as-fast-build == false
        uses: actions/download-artifact@v8
        with:
          name: conan-context
          path: .conan-context

      - name: Configure Conan
        uses: $/.github/actions/configure-conan
        with:
          json-secrets: ${{ toJson(secrets) }}
          conan-context-path: ${{ env.CONAN_CONTEXT_PATH }}

      - id: resolve
        shell: bash
        env:
          REQUESTED_PROFILES: ${{ inputs.conan-profiles != '' && inputs.conan-profiles || needs.generate-conan-context.outputs.build-profile-list }}
          SOURCE_BUILD_CONTEXT: ${{ inputs.source-build-context != '' && inputs.source-build-context || inputs.force-build }}
          FALLBACK_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${REQUESTED_PROFILES}" ] || [ "${REQUESTED_PROFILES}" = "null" ]; then
            echo "Unable to determine build profiles"
            exit 1
          fi

          SHOULD_BUILD=false
          RELEVANT_PROFILES=()
          BUILD_FROM_SOURCE_CONTEXT=false

          PKG_REPO=""
          PKG_NAME=""

          if [ "${{ inputs.build-missing }}" = "true" ] && [ -n "${SOURCE_BUILD_CONTEXT}" ]; then
            PKG_REPO=$(echo "$SOURCE_BUILD_CONTEXT" | jq -r '.package_context.repo // empty')
            PKG_NAME=$(echo "$SOURCE_BUILD_CONTEXT" | jq -r '.package_context.name // empty')

            if [ -z "$PKG_NAME" ] && [ -n "$PKG_REPO" ]; then
              PKG_NAME=${PKG_REPO#*/}
            fi

            if [ -z "$PKG_NAME" ]; then
              echo "Unable to determine package name from source_build_context"
              exit 1
            fi

            BUILD_FROM_SOURCE_CONTEXT=true
          else
            PKG_NAME=$(conan inspect . --format=json | jq -r '.name // empty')
            if [ -z "$PKG_NAME" ] || [ "$PKG_NAME" = "null" ]; then
              PKG_NAME="${FALLBACK_PACKAGE_NAME}"
            fi

            if [ -z "$PKG_NAME" ] || [ "$PKG_NAME" = "null" ]; then
              echo "Unable to determine package name for direct build"
              exit 1
            fi
          fi

          while IFS= read -r PROFILE; do
            [ -n "$PROFILE" ] || continue

            if [ "$BUILD_FROM_SOURCE_CONTEXT" = "true" ]; then
              # shellcheck disable=SC2086 # Split the generated sequence of -c options.
              conan graph info . \
                -pr:h "$PROFILE" \
                $CONAN_CONTEXT_CONF_ARGS \
                --format=json \
                > "graph-${PROFILE}.json"

              if jq -e --arg pkg "$PKG_NAME" '
                  [.graph.nodes // {} | to_entries[] | .value.ref // ""] | any(startswith($pkg + "/"))
                ' "graph-${PROFILE}.json" >/dev/null; then
                SHOULD_BUILD=true
                RELEVANT_PROFILES+=("\"$PROFILE\"")
              fi
              continue
            fi

            conan profile show -pr:h "$PROFILE" --format=json > "profile-${PROFILE}.json"
            replacement=$(
              jq -r --arg pkg "$PKG_NAME" '
                .host.replace_requires // {}
                | to_entries[]
                | select((.key | split("/")[0]) == $pkg)
                | .value
              ' "profile-${PROFILE}.json" | head -n1
            )

            if [ -n "$replacement" ] && [ "$replacement" != "null" ]; then
              replacement_name=${replacement%%/*}
              if [ "$replacement_name" != "$PKG_NAME" ]; then
                echo "Skipping profile ${PROFILE}: ${PKG_NAME} is replaced by ${replacement_name}"
                continue
              fi
            fi

            SHOULD_BUILD=true
            RELEVANT_PROFILES+=("\"$PROFILE\"")
          done < <(echo "$REQUESTED_PROFILES" | jq -r '.[]')

          if [ "$SHOULD_BUILD" = "true" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            echo "relevant-profiles=[$(IFS=,; echo "${RELEVANT_PROFILES[*]}")]" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "relevant-profiles=[]" >> "$GITHUB_OUTPUT"
          fi

  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.resolve.outputs.platform }}
      label: ${{ steps.resolve.outputs.label }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_RUNNER_TYPE: ${{ inputs.runner-type }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          case "${INPUT_RUNNER_TYPE}" in
            "")
              platform=eks
              if [[ "${REPOSITORY_NAME,,}" == qt* ]]; then
                label=eks-runner-linux-x64-large
              else
                label=eks-runner-linux-x64-medium
              fi
              ;;
            ec2-x64-spot)
              platform=ec2
              label=ubuntu-24.04-internal
              ;;
            ec2-x64-ondemand)
              platform=ec2
              label=ubuntu-24.04-internal-ondemand
              ;;
            ec2-x64-ondemand-large)
              platform=ec2
              label=ubuntu-24.04-internal-ondemand-large
              ;;
            ec2-arm64-ondemand)
              platform=ec2
              label=ubuntu-24.04-arm-internal-ondemand
              ;;
            ec2-arm64-ondemand-large)
              platform=ec2
              label=ubuntu-24.04-arm-internal-ondemand-large
              ;;
            *)
              echo "Unsupported runner-type '${INPUT_RUNNER_TYPE}'." >&2
              echo "Supported values: <empty> (EKS), ec2-x64-spot, ec2-x64-ondemand, ec2-x64-ondemand-large, ec2-arm64-ondemand, ec2-arm64-ondemand-large" >&2
              exit 1
              ;;
          esac

          echo "Runner type '${INPUT_RUNNER_TYPE}' resolved to ${platform} / ${label}"
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

          {
            echo "### Build runner"
            echo ""
            echo "Requested \`runner-type\`: \`${INPUT_RUNNER_TYPE:-<empty>}\` -> \`${label}\` (${platform})"
            echo ""
            echo "| \`runner-type\` | Runner label |"
            echo "|---|---|"
            echo "| *empty* (default) | \`eks-runner-linux-x64-medium\`, or \`-large\` for \`qt*\` repositories |"
            echo "| \`ec2-x64-spot\` | \`ubuntu-24.04-internal\` |"
            echo "| \`ec2-x64-ondemand\` | \`ubuntu-24.04-internal-ondemand\` |"
            echo "| \`ec2-x64-ondemand-large\` | \`ubuntu-24.04-internal-ondemand-large\` |"
            echo "| \`ec2-arm64-ondemand\` | \`ubuntu-24.04-arm-internal-ondemand\` |"
            echo "| \`ec2-arm64-ondemand-large\` | \`ubuntu-24.04-arm-internal-ondemand-large\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-upload:
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    if: >-
      always() &&
      needs.resolve-runner.outputs.platform == 'eks' &&
      needs.collector-relevance.outputs.should-build == 'true' && (
        inputs.conan-profiles != '' ||
        !inputs.run-unit-tests ||
        needs.unit-tests.result == 'success'
      )
    needs:
      - generate-conan-context
      - unit-tests
      - collector-relevance
      - resolve-runner
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.collector-relevance.outputs.relevant-profiles) }}
    container:
      image: repository.nexus.vixtechnology.com/docker-internal-group/${{ matrix.profile }}-compiler:main
      credentials:
        username: ${{ secrets.REPOSITORY_USERNAME_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
        password: ${{ secrets.REPOSITORY_TOKEN_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and upload ${{ matrix.profile }}
        uses: $/.github/actions/conan-build-and-upload
        with:
          profile: ${{ matrix.profile }}
          json-secrets: ${{ toJson(secrets) }}
          conan-context-path: ${{ env.CONAN_CONTEXT_PATH }}
          conan-context: ${{ inputs.conan-context }}
          source-build-context: ${{ inputs.source-build-context != '' && inputs.source-build-context || inputs.force-build }}
          build-missing: ${{ inputs.build-missing }}
          extra-pip-packages: ${{ inputs.extra-pip-packages }}

  build-and-upload-ec2:
    runs-on: ${{ needs.resolve-runner.outputs.label }}
    if: >-
      always() &&
      needs.resolve-runner.outputs.platform == 'ec2' &&
      needs.collector-relevance.outputs.should-build == 'true' && (
        inputs.conan-profiles != '' ||
        !inputs.run-unit-tests ||
        needs.unit-tests.result == 'success'
      )
    needs:
      - generate-conan-context
      - unit-tests
      - collector-relevance
      - resolve-runner
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.collector-relevance.outputs.relevant-profiles) }}
    steps:
      - uses: actions/checkout@v6
      # EC2 runners have no compiler image: Conan is installed here, jq, yq and gh must come with the runner image.
      - name: Install Conan and verify workflow tools
        shell: bash
        env:
          CONAN_VERSION: "2.28.1"
        run: |
          python3 -m pip install --user "conan==${CONAN_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          for tool in conan jq yq gh; do
            if ! command -v "$tool" >/dev/null; then
              echo "Missing required tool on the EC2 runner: $tool" >&2
              exit 1
            fi
          done
          conan --version
      - name: Build and upload ${{ matrix.profile }}
        uses: $/.github/actions/conan-build-and-upload
        with:
          profile: ${{ matrix.profile }}
          json-secrets: ${{ toJson(secrets) }}
          conan-context-path: ${{ env.CONAN_CONTEXT_PATH }}
          conan-context: ${{ inputs.conan-context }}
          source-build-context: ${{ inputs.source-build-context != '' && inputs.source-build-context || inputs.force-build }}
          build-missing: ${{ inputs.build-missing }}
          extra-pip-packages: ${{ inputs.extra-pip-packages }}

  build-result:
    runs-on: ubuntu-latest
    needs:
      - build-and-upload
      - build-and-upload-ec2
    if: always()
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - id: result
        shell: bash
        env:
          EKS_RESULT: ${{ needs.build-and-upload.result }}
          EC2_RESULT: ${{ needs.build-and-upload-ec2.result }}
        run: |
          # Only one of the two build jobs runs, the other one is skipped.
          result=skipped
          for job_result in "${EKS_RESULT}" "${EC2_RESULT}"; do
            case "${job_result}" in
              failure|cancelled)
                result=failure
                break
                ;;
              success)
                result=success
                ;;
            esac
          done
          echo "result=${result}" >> "$GITHUB_OUTPUT"

  docker-profile-plan:
    runs-on: eks-runner-linux-x64-medium
    needs: generate-conan-context
    # `build-missing` is set by collector rebuilds. Library/package builds
    # publish Conan artifacts and trigger their collector afterwards.
    if: inputs.run-as-fast-build == false && inputs.build-missing == true
    outputs:
      profiles: ${{ steps.plan.outputs.profiles }}
      image-target: ${{ steps.plan.outputs.image-target }}
    container:
      image: repository.nexus.vixtechnology.com/docker-internal-group/aurora-compiler:main
      credentials:
        username: ${{ secrets.REPOSITORY_USERNAME_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
        password: ${{ secrets.REPOSITORY_TOKEN_REPOSITORY_NEXUS_VIXTECHNOLOGY_COM }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: conan-context
          path: .conan-context
      - name: Configure Conan
        uses: Group-Devices/emb-github-workflows/.github/actions/configure-conan@release/v1.0
        with:
          json-secrets: ${{ toJson(secrets) }}
          conan-context-path: ${{ env.CONAN_CONTEXT_PATH }}
      - id: plan
        name: Select Docker profiles
        shell: bash
        run: |
          set -euo pipefail
          selected=()
          # A Docker host profile alone does not make a collector an image
          # producer.  Only contexts that provide a framework or project
          # recipe may dispatch a secretary-docker workflow.
          if ! yq -e '(.docker.framework != null) or (.docker.project != null)' "$CONAN_CONTEXT_PATH" >/dev/null; then
            echo "image-target=" >> "$GITHUB_OUTPUT"
            echo "profiles=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_context='${{ inputs.source-build-context != '' && inputs.source-build-context || inputs.force-build }}'
          source_package=$(printf '%s' "$source_context" | jq -r '.package_context.name // empty')
          image_target=""
          export source_package
          if [ -n "$source_package" ]; then
            image_target=$(yq -r '.docker.framework.triggers[env(source_package)] // ""' "$CONAN_CONTEXT_PATH")
          fi
          echo "image-target=$image_target" >> "$GITHUB_OUTPUT"
          while IFS= read -r profile; do
            mode=$(conan profile show -pr:h "$profile" --format=json | jq -r '.host.conf["user.runtime:mode"] // ""')
            [ "$mode" != docker ] || selected+=("$profile")
          done < <(yq -r '.build.profiles[]' "$CONAN_CONTEXT_PATH")
          jq -cn '$ARGS.positional' --args "${selected[@]}" | sed 's/^/profiles=/' >> "$GITHUB_OUTPUT"

  dispatch-docker-image-build:
    runs-on: ubuntu-latest
    needs:
      - generate-conan-context
      - build-result
      - docker-profile-plan
    # A delivery collector has been published and at least one of its profiles
    # is a Docker runtime. Feature/WIP builds must not dispatch an image build:
    # their branch is intentionally not required to exist in the context repo.
    # Framework images are owned by the context; project images are owned by
    # the collector that was just published.
    if: >-
      always() &&
      inputs.run-as-fast-build == false &&
      inputs.build-missing == true &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      needs.build-result.outputs.result == 'success' &&
      needs.docker-profile-plan.result == 'success' &&
      needs.docker-profile-plan.outputs.profiles != '[]'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: conan-context
          path: .conan-context

      - id: destination
        name: Resolve Docker build workflow
        shell: bash
        run: |
          set -euo pipefail
          context="${CONAN_CONTEXT_PATH}"
          bundle=$(yq -r '.bundle // ""' "$context")
          if yq -e '.docker.framework' "$context" >/dev/null; then
            workflow="build-framework.yml"
            repository="$bundle"
          elif yq -e '.docker.project' "$context" >/dev/null; then
            workflow="build-project-images.yml"
            repository="$GITHUB_REPOSITORY"
          else
            echo "No Docker image workflow is declared by this context" >&2
            exit 1
          fi
          test -n "$bundle" && test "$bundle" != "null"
          owner=${repository%%/*}
          test -n "$owner" && test "$owner" != "$repository"
          echo "bundle=$repository" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

      - name: Authenticate context owner
        uses: $/.github/actions/gh-auth-owner
        with:
          owner: ${{ steps.destination.outputs.owner }}
          json-secrets: ${{ toJson(secrets) }}

      - name: Check Docker build destination
        shell: bash
        run: |
          set -euo pipefail
          repository="${{ steps.destination.outputs.bundle }}"
          workflow="${{ steps.destination.outputs.workflow }}"
          ref="${{ github.ref_name }}"
          gh repo view "$repository" --json name --jq .name >/dev/null
          gh api "repos/$repository/branches/$ref" --silent >/dev/null
          gh api "repos/$repository/contents/.github/workflows/$workflow?ref=$ref" --silent >/dev/null

      - name: Dispatch Docker image build
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching ${{ steps.destination.outputs.workflow }} in ${{ steps.destination.outputs.bundle }} for ${{ github.ref_name }}"
          gh workflow run "${{ steps.destination.outputs.workflow }}" \
            --repo "${{ steps.destination.outputs.bundle }}" \
            --ref "${{ github.ref_name }}"

  skip-collector:
    runs-on: ubuntu-latest
    needs:
      - collector-relevance
    if: inputs.build-missing == true && needs.collector-relevance.outputs.should-build != 'true'
    steps:
      - run: echo "Changed package is not present in the collector dependency graph for any configured profile. Skipping collector rebuild and context delivery."

  resolve-rebuild-collectors:
    runs-on: ubuntu-latest
    needs:
      - generate-conan-context
      - build-result
    if: always() && inputs.run-as-fast-build == false && inputs.enable-rebuild-collectors && needs.build-result.outputs.result == 'success'
    outputs:
      collectors-list: ${{ steps.resolve.outputs.collectors-list }}
    steps:
      - id: resolve
        shell: bash
        env:
          COLLECTORS: ${{ needs.generate-conan-context.outputs.collectors-list }}
          COLLECTOR_TOPOLOGY: ${{ needs.generate-conan-context.outputs.collector-topology }}
          BUILD_MISSING: ${{ inputs.build-missing }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REBUILD_TARGET: ${{ inputs.rebuild-target }}
        run: |
          set -euo pipefail

          # ONE COLLECTOR
          if [ "$COLLECTOR_TOPOLOGY" = "{}" ] || [ -z "$COLLECTOR_TOPOLOGY" ]; then
            echo "No collector topology configured."
            echo "collectors-list=$COLLECTORS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # COLLECTOR TOPOLOGY
          # 1- Extract mapping info
          echo "Resolving collector topology..."
          # Build child -> parent lookup
          PARENT_MAP=$(
            echo "$COLLECTOR_TOPOLOGY" | jq -c '
              reduce (
                to_entries[]
                | .key as $parent
                | (.value.children // [])[]
                | { child: ., parent: $parent }
              ) as $e
              ({}; .[$e.child] = $e.parent)
            '
          )
          
          # Find root collectors (collectors never referenced as children)
          ROOTS=$(
            echo "$COLLECTOR_TOPOLOGY" | jq -c '
              . as $topology
              | ($topology | keys) as $all
              | ([ .[]?.children[]? ] | unique) as $children
              | $all - $children
            '
          )
          
          # Build first-level collectors (children of all roots)
          FIRST_LEVEL_COLLECTORS=$(
            jq -cn \
              --argjson topology "$COLLECTOR_TOPOLOGY" \
              --argjson roots "$ROOTS" '
                [
                  $roots[]
                  | $topology[.]
                  | (.children // [])[]
                ] | unique
              '
          )
          
          echo "Collector topology:"
          echo "  Root collectors : $(echo "$ROOTS" | jq -c '.')"
          echo "  Parent map      : $(echo "$PARENT_MAP" | jq -c '.')"

          if [ "$(echo "$ROOTS" | jq 'length')" -ne 1 ]; then
              echo "WARNING: Expected exactly one root collector, found:"
              echo "$ROOTS" | jq .
          fi
          
          # 2- Package (not a collector) - check next target
          if [ "$BUILD_MISSING" != "true" ]; then
            if  [ -n "$REBUILD_TARGET" ]; then
                # Check if REBUILD_TARGET valid
                if ! jq -e --arg target "$REBUILD_TARGET" \
                  'has($target) or any(.[]?.children[]?; . == $target)' \
                  <<< "$COLLECTOR_TOPOLOGY" >/dev/null; then
                  echo "ERROR: Unknown rebuild target: $REBUILD_TARGET"
                  exit 1
                fi
                # Use specified rebuild target when specified
                selected=$(jq -cn --arg target "$REBUILD_TARGET" '[$target]')
                echo "Using rebuild target collector: $REBUILD_TARGET"
            else
                selected="$FIRST_LEVEL_COLLECTORS"
                echo "No rebuild target defined - using first-level collectors:"
                echo "$FIRST_LEVEL_COLLECTORS" | jq .
            fi
            echo "collectors-list=$selected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3- Package (collector) - check next target
          parent=$(echo "$PARENT_MAP" | jq -r \
            --arg current "$CURRENT_REPOSITORY" \
            '.[$current] // empty')

          if [ -n "$parent" ]; then
            selected=$(jq -cn --arg parent "$parent" '[$parent]')
            echo "Collector cascade: $CURRENT_REPOSITORY -> $parent"
          else
            selected='[]'
            echo "Collector cascade complete: $CURRENT_REPOSITORY has no parent"
          fi

          echo "collectors-list=$selected" >> "$GITHUB_OUTPUT"

  rebuild-collectors:
    runs-on: ubuntu-latest
    if: >-
      always() &&
      inputs.run-as-fast-build == false &&
      inputs.enable-rebuild-collectors &&
      needs.build-result.outputs.result == 'success' &&
      needs.resolve-rebuild-collectors.outputs.collectors-list != '[]'
    needs:
      - generate-conan-context
      - build-result
      - resolve-rebuild-collectors
    strategy:
      fail-fast: false
      matrix:
        collector: ${{ fromJson(needs.resolve-rebuild-collectors.outputs.collectors-list) }}
    env:
      TARGET_WORKFLOW: "rebuild.yml"
    steps:
      - name: Extract owner of collector ${{ matrix.collector }}
        run: |
          owner=$(echo "${{ matrix.collector }}" | cut -d'/' -f1)
          echo "Owner of collector: ${owner}"
          echo "COLLECTOR_OWNER=${owner}" >> "$GITHUB_ENV"

      - name: Extract authentication token for ${{ env.COLLECTOR_OWNER }}
        uses: $/.github/actions/gh-auth-owner
        with:
          owner: ${{ env.COLLECTOR_OWNER }}
          json-secrets: ${{ toJson(secrets) }}

      - name: Check if repository ${{ matrix.collector }} exists
        run: |
          if gh repo view "${{ matrix.collector }}" --json name --jq .name > /dev/null 2>&1; then
            echo "Repository ${{ matrix.collector }} exists."
          else
            echo "Repository ${{ matrix.collector }} does not exist or actual token cannot see it."
            exit 1
          fi

      - name: Check if branch ${{ github.ref_name }} exists in ${{ matrix.collector }}
        run: |
          if gh api repos/${{ matrix.collector }}/branches/${{ github.ref_name }} --silent > /dev/null 2>&1; then
            echo "Branch ${{ github.ref_name }} found in ${{ matrix.collector }}"
          else
            echo "Branch ${{ github.ref_name }} does not exists in ${{ matrix.collector }}"
            exit 1
          fi

      - name: Check if workflow ${{ env.TARGET_WORKFLOW }} exists in ${{ matrix.collector }}/${{ github.ref_name }}
        run: |
          if gh api repos/${{ matrix.collector }}/contents/.github/workflows/${{ env.TARGET_WORKFLOW }}?ref=${{ github.ref_name }} --silent > /dev/null; then
            echo "Workflow ${TARGET_WORKFLOW} exists in ${{ matrix.collector }}."
          else
            echo "Workflow ${TARGET_WORKFLOW} does not exists in ${{ matrix.collector }}."
            exit 1
          fi

      - id: package-context
        name: Build package source context
        uses: $/.github/actions/build-source-build-context
        with:
          append-key: package_context

      - id: cascade-package-context
        name: Resolve package source context for collector topology
        if: needs.generate-conan-context.outputs.collector-topology != '{}'
        shell: bash
        env:
          PACKAGE_CONTEXT: ${{ steps.package-context.outputs.context }}
          SOURCE_BUILD_CONTEXT: ${{ inputs.source-build-context }}
        run: |
          if [ -n "$SOURCE_BUILD_CONTEXT" ]; then
            CONTEXT="$SOURCE_BUILD_CONTEXT"
            echo "Preserving source package context from collector cascade"
          else
            CONTEXT="$PACKAGE_CONTEXT"
            echo "Starting collector topology from current package"
          fi

          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"

      - name: Dispatch workflow of ${{ matrix.collector }} on ${{ github.ref_name }}
        env:
          PACKAGE_CONTEXT: ${{ steps.package-context.outputs.context }}
          CASCADE_CONTEXT: ${{ steps.cascade-package-context.outputs.context }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          if [ -n "$CASCADE_CONTEXT" ]; then
            JSON="$CASCADE_CONTEXT"
          else
            JSON="$PACKAGE_CONTEXT"
          fi

          echo "context pass $JSON"
          echo "command gh workflow run ${TARGET_WORKFLOW} --repo ${{ matrix.collector }} --ref ${{ github.ref_name }} --field source_build_context=$JSON --field built_package=$JSON"
          gh workflow run "${TARGET_WORKFLOW}" \
            --repo "${{ matrix.collector }}" \
            --ref "${{ github.ref_name }}" \
            --field rebuild_cause="Rebuild collector due to package change in ${{ github.repository }} on ${{ github.ref_name }} (sha $SHORT_SHA)" \
            --field source_build_context="$JSON" \
            --field built_package="$JSON"            

  rebuild-context:
    runs-on: ubuntu-latest
    needs: 
      - build-result
    if: always() && inputs.run-as-fast-build == false && inputs.enable-rebuild-context && needs.build-result.outputs.result == 'success'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: conan-context
          path: .conan-context

      - name: Extract context owner
        run: |
          context=$(yq e '.bundle' "${CONAN_CONTEXT_PATH}")
          echo "Context: ${context}"
          OWNER=$(echo "${context}" | cut -d'/' -f1)
          echo "Owner: ${OWNER}"
          echo "CONTEXT_OWNER=${OWNER}" >> "$GITHUB_ENV"
      - name: Extract authentication token
        uses: $/.github/actions/gh-auth-owner
        with:
          owner: ${{ env.CONTEXT_OWNER }}
          json-secrets: ${{ toJson(secrets) }}
      - id: collector-context
        name: Build collector source context
        uses: $/.github/actions/build-source-build-context
        with:
          append-key: collector_context
          incoming-context: ${{ inputs.source-build-context }}
          fallback-context: ${{ inputs.force-build }}
      - name: Call context delivery  
        run: |  
          context=$(yq e '.bundle' "${CONAN_CONTEXT_PATH}")
          SOURCE_BUILD_CONTEXT='${{ steps.collector-context.outputs.context }}'
          DELIVERY_BUILD_CONTEXT=$(printf '%s' "$SOURCE_BUILD_CONTEXT" | jq -c '. + {delivery_options: ((.delivery_options // {}) + {docs_enabled: false})}')
          COLLECTOR_REPO=$(echo "$DELIVERY_BUILD_CONTEXT" | jq -r '.collector_context.repo // "unknown-collector"')
          PACKAGE_REPO=$(echo "$DELIVERY_BUILD_CONTEXT" | jq -r '.package_context.repo // "unknown-package"')
          COLLECTOR_NAME=${COLLECTOR_REPO#*/}
          PACKAGE_NAME=${PACKAGE_REPO#*/}
          gh workflow run "delivery.yml" \
            --repo "${context}" \
            --ref "${{ github.ref_name }}" \
            --field rebuild_cause="Rebuild context after collector rebuild (${COLLECTOR_NAME}) due to package change in ${PACKAGE_NAME} on ${{ github.ref_name }}" \
            --field source_build_context="$DELIVERY_BUILD_CONTEXT"
